  idea:
    inform_edges_total_length: "D’après votre télédéclaration PAC %{year} et les données IGN, vous possédez %{edges_total_length} mètres de haies buissonnantes et arborescentes."
    ask_bush_edge_lenght: "Combien de mètres représentent vos haies buisson nantes (moins de 5 m de haut) ?"
    confirm_fallow_land_1: "D’après votre télédéclaration PAC et les données IGN vous possédez %{fallow_area} hectares de jachère."
    confirm_fallow_land_2: "Confirmez-vous cette valeur ?"
    gardening_type: 'Parmi vos activités de maraîchage suivantes, lesquelles sont des productions industrielles de légumes de plein champ ?=multiple_choices'
    confirm_sth_1: "Vous avez %{sth} hectares de surfaces toujours en herbe."
    confirm_sth_2: "Confirmez-vous cette valeur ?"
    confirm_sth_3: "La surface toujours en herbe correspond à la surface productive toujours en herbe (pâturée ou fauchée) d’au moins 10 ans et comprend par exemple, les prairies ou les alpages"
    intra_parcel_mix_1: "Selon vos données saisies depuis le module Production, votre espèce principale en surface parmi vos activités de grandes cultures, cultures fourragères et industrielles est<b> %{variety} </b>.<br>Les questions qui suivent concernent cette espèce."
    intra_parcel_mix_2: "Pour cette espèce principale, cultivez-vous un mélange variétal intra-parcellaire ?"
    arboricultural_intra_parcel_mix_1: "Selon vos données saisies depuis le module Production, votre espèce principale en surface parmi vos activités arboricoles est<b> %{variety} </b><br>Les questions qui suivent concernent cette espèce."
    main_ugb_animal_1: "Selon vos données saisies depuis le module Production, votre espèce animale principale en UGB est<b> %{variety} </b><br>Les questions qui suivent concernent cette espèce."
    main_ugb_animal_2: "Pour cette espèce, combien avez-vous de mères croisées dans votre cheptel ?"
    questions:
      A1_01: "La question qui suit concerne vos activités de maraîchage.<br>Quel type de maraîchage faites-vous (plein champ, sous abris, mixte) ?"
      A1_03: "La question qui suit concerne vos activités de cultures productives annuelles, pluriannuelles, industrielles et pérennes (hors prairies permanentes).<br><br>Combien d’espèces productives cultivez-vous dans chaque association culturale (y compris prairies temporaires et agroforesterie) ?<div class='idea-information'><i style='color: #3340A4;' class='icon icon-help-outline'></i> Par exemple, si vous avez une première association mélangeant la féverole et la luzerne ainsi qu’une seconde association mélangeant la féverole et le maïs, vous cultivez au total 4 espèces en association. Si vous n'avez que des cultures en pur, saisissez 0.</div>"
      A1_08: "Les questions qui suivent concernent vos activités de maraîchage.<br>Est-ce que la diversification des familles botaniques est présente toute l’année ?<div class='idea-information'><i style='color: #3340A4;' class='icon icon-help-outline'></i> Par exemple, la carotte appartient à la famille botanique des Apiacées et le chou appartient à celle des Brassicacées.</div>"
      A2_01: "Participez-vous à des programmes d'entretien de ressources génétiques ?<div class='idea-information'><i style='color: #3340A4;' class='icon icon-help-outline'></i> Ces programmes peuvent concerner la sélection génétique sur des races à petit effectif, sur des espèces, variétés, cépages oubliés ou la sélection participative avec possibilité d’en bénéficier, sélection massale viticole, etc.</div>"
      A2_02: "Prenez-vous en compte des critères de tolérance/résistance/rusticité à des stress biotiques ou abiotiques dans vos choix variétaux ou de porte-greffes ?<div class='idea-information'><i style='color: #3340A4;' class='icon icon-help-outline'></i> Les stress biotiques correspondent aux maladies, ravageurs, etc., et les stress abiotiques correspondent à la sécheresse, carence en minéraux, vent, etc.</div>"
      A2_07: "Pour cette espèce principale, cultivez-vous une variété population ?<div class='idea-information'><i style='color: #3340A4;' class='icon icon-help-outline'></i> Les variétés population sont synonyme de variétés paysannes, locales ou anciennes. Elles existent depuis le début de l’agriculture. Le re-semis de semences de fermes n’est pas comptabilisé comme une variété population.</div>"
      A2_13: "Les questions qui suivent concernent vos activités viticoles.<br>Pratiquez-vous l’encépagement polyclonal ?"
      A2_14: "Cultivez-vous un cépage très peu représenté (< 5 %) dans votre zone d'appellation ?"
      A2_15: "Les questions qui suivent concernent vos activités de maraîchage.<br>Cultivez-vous une variété population ?<div class='idea-information'><i style='color: #3340A4;' class='icon icon-help-outline'></i> Les variétés population sont synonyme de variétés paysannes, locales ou anciennes. Elles existent depuis le début de l’agriculture. Le re-semis de semences de fermes n’est pas comptabilisé comme une variété population.</div>"
      A2_17: "Parmi votre surface toujours en herbe, combien d’hectares sont gérés extensivement ?<div class='idea-information'><i style='color: #3340A4;' class='icon icon-help-outline'></i> Sont considérées comme gérées de manière extensive les surfaces avec moins de 40 unités d’azote/ha/an, sans fauche avant juin, sans fauche des refus, sans pâturage permanent ou tournant, etc.</div>"
      A2_22: "Pour cette espèce, participez-vous à des programmes de sélection réalisés sur des critères associés à la rusticité ?"
      A4_09: "Les questions qui suivent concernent vos activités de maraîchage.<br>Mise en place de cultures en association et/ou semis sous couvert sur une même planche ?"
      A4_16: "Sur votre exploitation, combien avez-vous de mètres de ripisylves ?"
      A4_20: "Sur votre exploitation, combien d’hectares en agroforesterie intraparcellaire avez-vous ?"
      A4_21: "Sur votre exploitation, combien avez-vous d’hectares de tourbières ?"
